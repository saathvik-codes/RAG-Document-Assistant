services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10

  ollama_init:
    image: ollama/ollama:latest
    container_name: rag_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull ${OLLAMA_MODEL:-llama3}"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - VECTORSTORE_DIR=/data/rag_index
      - INDEX_MANIFEST_PATH=/data/rag_index/manifest.json
      - EMBEDDINGS_MODEL_NAME=${EMBEDDINGS_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      - CHUNK_SIZE=${CHUNK_SIZE:-800}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-150}
      - RETRIEVAL_K=${RETRIEVAL_K:-4}
      - RETRIEVAL_FETCH_K=${RETRIEVAL_FETCH_K:-24}
      - RETRIEVAL_LAMBDA_MULT=${RETRIEVAL_LAMBDA_MULT:-0.35}
      - MAX_CONTEXT_DOCS=${MAX_CONTEXT_DOCS:-5}
      - MULTI_QUERY_COUNT=${MULTI_QUERY_COUNT:-3}
      - KEYWORD_RETRIEVAL_K=${KEYWORD_RETRIEVAL_K:-8}
      - MIN_ANSWER_CONFIDENCE=${MIN_ANSWER_CONFIDENCE:-0.35}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
    volumes:
      - rag_index_data:/data
    depends_on:
      ollama_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 20s
      timeout: 10s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag_frontend
    ports:
      - "8501:8501"
    environment:
      - APP_USE_BACKEND_API=true
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama_data:
  rag_index_data:
